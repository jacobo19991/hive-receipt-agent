[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-receipt-agent"
version = "0.1.0"
description = "A minimal LangGraph agent that emits verifiable Hive receipts."
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3",
  "langchain-hive @ git+https://github.com/srotzin/langchain-hive.git",
  "langgraph>=0.2",
  "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hive-receipt-agent = "hive_receipt_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
